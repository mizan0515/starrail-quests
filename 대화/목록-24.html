 열차 아카이브를 찾아봤어요…… 게파드 방위관님과 논의해봐야지…… 히메코 씨의 음료를 마셔봤어요…… 열차 여정을 함께할 수 있다면…… 어디 갔지……? 하나도 안 보여…… 폼폼… 낯익어…… 열차의 분위기가 신기해요…… 벨로보그 밖의 세상이 이렇게 넓을 줄은 몰랐어요…… 열차 안이 좀 따듯하네…… 설원에서 이걸 찾았거든요…… 하, 장관이군! 열차에서 밥은…… 그런 최첨단 기술이 있다면…… 훈련… 훈련 Mar. 7th와 단항…… 내 손에 있는 물건들…… 풍경 괜찮네…… 히메코 씨와 반나절이나 잡담을 나눴어… 장기 잘 두세요? 유운천군의 전설…… 약차의 레시피가 필요하세요? 답례도 못 드렸어요…… 열차는 이렇게 생겼구나~ 복순아! 기다려~ 1, 2, 3, 4, 5~ 복순아, 배고파? 사들여. 그래, 바로 사 오고 가는 게 예의지… 이 별하늘…… 이건, 「커피」…… 열차 안은 정말 따뜻하네 에이언즈, 그리고 운명의 길…… 폼폼은 대체…… 너한테 줄 선물이 있어…… 별이 엄청 많네…… …응, 정했어 폼폼이 좋아할까…? 열차팀의 방…… 너무 작아…… 자그마한 성의…… 백문이 불여일견이라더니…… 이런 여유로운 느낌은 정말 흔치 않아…… 무명객이지만, 은하열차와 인연이 없다니…… 열차 인테리어가 마음에 들어 단항은 요즘 어떻게 지내려나…… 열차를 위해 선물을 가져왔네 정말 평온하네요 뭔가 보이지 않는 게 있는 것 같아요… 차장님한테서 들었는데…… 고민이 있어서 상담 좀 받고 싶어요…… 열차팀 사람들은 다 좋은 분들이에요 이걸 드리려고 가져왔어요…… 고요한 우주… 자수를 놓다가… 손을 다쳤어 이 디저트들… 꽃이… 조금 시들어버린 것 같아 열차가… 언젠간 내 고향도 지나갈까? 열차팀과… 지니어스 클럽? 꽤 의외이군… 듣자 하니 열차 아카이브에서…… 넌 어떤 사람이지? 스트레스를 마주했을 때… 천재와 평범한 사람…… 뭘 주면 좋을까…… 이게 꿈속은 아니겠죠…… 와, 구조가 엄청 복잡하네요…… 아카이브에 하루 종일 파묻혀 있고 싶어요…… 열차에 탑승한 승객…… 우아한 음악…… 다들 좋아할까요……? 브라보, 대박이군. 베이비… 켁, 켁켁!! 넌 직감을 믿나? 혹시 열차에 나사 있어? 완전히 말려들었군… 이 통에 들은 총알들 말인데… 편안한 느낌… 마음을 움직이는 힘이 있어요 인형이… 말을 하잖아…? 가발 모양과 색깔… 꿈세계와 현실… 선물을 준비했어요… 드디어 왔구나! 아카이브는 제법 흥미롭네~ 포근한 소파… 예비 협력 명단… 성격에 따라 가면을 만들면… 작은 선물을 가져왔어 떠다니는 기억 조각… 열차의 기억하는 자… 아늑한 방… 방문객 등록… 점을 쳐줄까? 소소한 선물이니 부담 갖지 마 당신을 찬미하고 싶군요… 안타까운 소식이군요 털 뭉치 장식… 아카이브 기록… 우주 레이싱… 씨앗과 결정석… 졸려…… 응, 응응! 내가 물어봐 줄게 맛있는 냄새! 하나——둘——셋…… 제자 Mar. 7th가 요즘…… 이 돌… 별들이 셀 수 없이 많은데 드문드문 흩어져 있네요…… 뭇별에 둘러싸여서 음료를 마시니, 여운이 남네요…… 정말 귀여운 모자네요…… 아주 오래전…… 내가 아는 건 너도 알고…… 이렇게 큰 케이크를 다 먹을 수 있을까요…… 손으로 하트 콩콩 눌러 주세요~ 배우 수업…… 내 다음 주제곡은…… 제2회 열차 콜라보…… 커피… 음료수… 캬…… 팬 전용 혜택…… 별들이 마치 촘촘히 엮인 보석 같군…… 꽤 흥미롭네…… 이것들을 아직 다 처리하지 못했어…… 레몬 음료 한 잔 더! 손 전용 연고…… 내가 점쳐줄게…… 별들의 시선…… 이렇게나 많은 노하우가 있다니… 졸린데, 어디 가서 좀 자야겠다… 진실은 오직 하나… 누구한테 거는 게 좋을까… 왜 안 팔릴까… 안녕 압도해버리면 그만이지…… 탐사할 수 있는 곳이 늘어났어… 새 기능을 좀 넣어 볼까…… 게임을 만들어 볼까? 허점이 있어… 개척…… 아주 좋아 좀 약하군 화끈 고추기름… 정교한 창조물이군 이 돌들은 병기에 탁월한 효과가 있어 익숙한 느낌…… 새로운 영감…… 아이들의 답글…… 야구 방망이 라쿤…… 열차 구경…… 신곡 미리 듣기…… 정말 편안해…… 광고 모델…… 엔터테인먼트 산업…… 집 같은데… 소중
