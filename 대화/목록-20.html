r _ql"><div class="sl-markdown-content"><script>__sp(700);</script><script>__sp(701);</script><script>__sp(849);</script><p class="page-deck">1개 사용 장면 중 1–1번째. 이 목록에서 화자와 구절을 찾아 읽거나, 상단 검색에서 전체 원문을 찾을 수 있습니다.</p><div class="universe-source-index not-content" data-universe-records data-query-key="contextQuery" data-limit-key="contextLimit" data-kind-key="contextWorld"><div class="universe-source-controls"><label class="universe-source-search"><span>현재 목록의 화자·원문 구절</span><input type="search" data-source-query placeholder="읽고 싶은 문구나 인물 이름"></label></div><p role="status" aria-live="polite" aria-atomic="true" data-source-count>1개 기록</p><div class="universe-source-list"><a id="universe-source-context-707d0125d928cfc9" class="universe-source-entry" href="/starrail-quests/대화/context-707d0125d928cfc9.html" data-reading-link data-source-record="context-707d0125d928cfc9" data-source-kind-value="지역 연결 확인 중" data-search="야옹~ 다 들켜버렸으니, 나도 더 이상 연기 안 할게 여기 숨어있으니까 엄청 편해, 너도 와서 해보라냥! 정말 예쁜 열차 칸이네, 창조물 파티를 열지 않기엔 너무 아깝잖아! 파티에서 분위기 띄우는 건 네가 맡고, 분위기 싸하게 만드는 건 내가 맡겠다냥 여기는 엄청 조용해서, 독서랑 사색하기에 좋다냥 도움이 필요하면 언제든 불러 막막함을 느끼고 인도가 필요하다면 날 찾아와 내가 축음기를 틀어주겠다냥 음, 관찰력이 제법이군 창조물 선배로서 나는 조용히 행동해야 한다냥 흑… 다 제 탓이에요. 요즘 우주정거장 창조물들이 완•매 님을 위한 찬가를 합창하려고 발성 연습 중인데, 저는… 도무지 늘지가 않네요 찬가 합창은 깔끔하고 웅장하면서 힘이 있어야 해! 별하늘 밖에는 뭐가 있을까? 더 큰 별하늘일까? 언젠가 내가 직접 가볼 거다냥 존재란 곧 감지되는 것. 네가 날 찾아냈으니, 내 존재가 더 확증된 셈이야 보다시피, 진리는 가장 눈에 띄는 곳에 숨겨져 있다냥 좋아… 친구, 네가 날 찾아냈으니 이번 판은 네가 이긴 걸로 쳐줄게 행운이 항상 함께하길 바란다냥 …너무 가까이 오지 마 나 자신을 제어하지 못할까 봐 무섭다냥 날 찾아냈다냥 근데 혹시 내가 일부러 여기 숨어서 네가 날 찾아내길 기다린 게 아닐까냥? 여긴 편안히 잠들기 좋은 곳이야, 안 그래? 너랑 같이 디저트를 먹고, 아름다운 꿈을 꿀 수 있다면 더 좋겠다냥 게임을 하나 기획하고 싶은데, 내용은 바로—— 창조물이 디저트를 쫓아다니면서 먹을 수 있는 거다냥! 기분이 안 좋을 때는 별하늘을 봐 별빛이 반짝반짝 빛나는 게, 마치 널 향해 미소 짓는 것 같다냥~ 음… 엄청 큰 용 모양 봉제 인형이 갖고 싶어 이러면 녀석의 등에 앉을 수 있다냥 냥~ 지금 기운이 넘쳐서, 숨바꼭질을 몇 번이고 더 할 수 있어 너도 같이 하자, 열차 칸의 좋은 파트너! 즐겁게 지내야 해, 모두가 네 미소를 기억할 수 있게~ 귀여운 디저트가 너와 함께할 거니까냥 완벽한 은신처를 찾았지만, 안 알려줄 거다냥! 알고 싶으면 내 수업을 들으러 와 내가 보기엔, 넌 오늘 안 좋은 일을 겪게 될 거야 흉운을 길운으로 바꾸고 싶다면, 날 데리고 디저트를 찾으러 가자냥! 지나가는 착한 친구, 나랑 같이 「열차 대소동」을 연출해 보지 않을래? 나랑 놀자. 재밌게 해주겠다냥! 잘 시간이야? 알려줘서 고맙다냥…… 침상이 좁긴 해도, 잠깐 눈 붙이기엔 딱 좋네. 무슨 일이든 푹 쉬고 나서 얘기하자 마침 잘됐다. 이 기회에 점 한번 쳐줄게 오늘 괘상에 이렇게 나왔어. 먹이 주기는 길, 무시하기는 흉. 어떻게 해야 할지 알겠지? …나랑 패 놀이 하러 온 거야? 아니야? 그럼 말고. 난 급한 일이 있으니까 방해하지 마라냥 자자, 절대 놓치지 마~ 모두 나를 주목해 달라냥! 왜 숨어 있었냐고? 당연히 너한테 서프라이즈를 해주려고 그렇지! 네 열차 칸에 날 초대하고 싶다라… 아예 불가능한 건 아니야 날 좀 더 칭찬해 줘야 한다냥 호기심은 발견의 첫걸음이지. 넌 수확이 있지만, 아쉽게도 난 아직이네 어떻게 해야 영원히 먹어도 줄지 않는 디저트를 가질 수 있을까냥? 내 음악이 별바다 같은 부드러움과 깃털처럼 포근한 꿈을 안겨주길 바라 마음에 든다면, 깨어난 후에도 계속 내 노래를 들어달라냥~ 내가… 여기를 집으로 생각해도 될까? 이제 다 같이 소꿉놀이를 할 수 있겠다냥… 쓰레기 케이크 쓰레기 케이크 아이스 케이크 아이스 케이크 찹쌀떡 찹쌀떡 엔젤 선데 엔젤 선데 중력 파이 중력 파이 슬픈 「완•매」의 창조물 화난 「완•매」의 창조물 별빛 라떼 별빛 라떼 블루베리 단지 블루베리 단지 허니 다이스 허니 다이스 참깨 파이 참깨 파이 선글라스냥 선글라스냥 솜반디 솜반디 케임 고수 케임 고수 팥우유 팥우유 나비 두부 무스 나비 두부 무스 플로트 코코넛 플로트 코코넛 피치 푸딩 피치 푸딩 민트 티라미냥 민트 티라미냥 백옥 쑥떡 백옥 쑥떡 꽃놀이 경단 꽃놀이 경단 꾸벅꾸벅냥 꾸벅꾸벅냥 태복떡 태복떡 행운의 디저트 행운의 디저트 말썽꾸러기 말썽꾸러기 등꽃 과자 등꽃 과자 람다의 친구 람다의 친구 조화의 야옹이 조화의 야옹이 순백의 아이 순백의 아이"><span class="universe-source-number" aria-hidden="true">01</span><span class="universe-source-content"><small>콘텐츠 설정의 대사 참조 · 56개 원문 행</small><strong>케이크 설정에 연결된 대사</strong><span class="universe-source-excerpt" data-source-preview-role="body">야옹~ 다 들켜버렸으니, 나도 더 이상 연기 안 할게</span></span><span aria-hidden="true">→</span></a></div><p data-source-empty hidden>이 구절을 포함한 기록이 없습니다.</p><button class="record-more" type="button" data-source-more>기록 더 보기</button></div><script>__sp(703);</script></div><script>__sp(2);</script><noscript><small>비공식 자료집 · 게임 콘텐츠 권리: HoYoverse 등 해당 권리자 <a href="/starrail-quests/자료안내.html">자료 안내</a> · <a href="https://github.com/mizan0515/starrail-quests/tree/main/src/lib/reading-kit/cva">CVA 소스 · GPLv3</a></small></noscript><nav class="reading-return" aria-label="읽던 위치" hidden data-reading-return data-pagefind-ignore><a><span aria-hidden="true">↶</span> 읽던 원문으로 돌아가기</a></nav><script>__sp(3);</script><script>__sp(5);</script></div></div></main></div></div></div></div></body></html><script>__sp(823);</script>
