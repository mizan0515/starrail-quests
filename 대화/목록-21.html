ss="sl-markdown-content"><script>__sp(700);</script><script>__sp(701);</script><script>__sp(849);</script><p class="page-deck">3개 사용 장면 중 1–3번째. 이 목록에서 화자와 구절을 찾아 읽거나, 상단 검색에서 전체 원문을 찾을 수 있습니다.</p><div class="universe-source-index not-content" data-universe-records data-query-key="contextQuery" data-limit-key="contextLimit" data-kind-key="contextWorld"><div class="universe-source-controls"><label class="universe-source-search"><span>현재 목록의 화자·원문 구절</span><input type="search" data-source-query placeholder="읽고 싶은 문구나 인물 이름"></label></div><p role="status" aria-live="polite" aria-atomic="true" data-source-count>3개 기록</p><div class="universe-source-list"><a id="universe-source-context-2021320ed4c5f6eb" class="universe-source-entry" href="/starrail-quests/대화/context-2021320ed4c5f6eb.html" data-reading-link data-source-record="context-2021320ed4c5f6eb" data-source-kind-value="지역 연결 확인 중" data-search="회색둥이 씨, 저를 응원해 주세요! 키메라 착하지, 문을 활짝 열렴~ 들어 봐, 물고기들이 공기 방울을 내뿜고 있어 상대가 엄청 약해 보이네, 너도 쟤들한텐 지기 싫지? 키메라의 사전에 「실패」란 없어 걱정 마, 이 명예는 내가 지킬 테니 착하지~ 배불리 먹어야 싸울 힘도 생겨 네가 걸친 금실이 부끄럽지 않도록, 진지하게 임하자 키메라 경, 적을 내게 굴복시켜라 너흰, 내가 가르친 키메라 중에 가장 우수해 금화든 키메라든, 전부 내 거야~ 최강의 키메라 훈련사가 되겠어! 귀여운 키메라, 사랑 속에서 쑥쑥 자라렴♪ 히아킨 트리비 히실렌스 에버나이트 마이데이 단항 카스토리스 아글라이아 케리드라 아낙사 사이퍼 파이논 키레네"><span class="universe-source-number" aria-hidden="true">01</span><span class="universe-source-content"><small>콘텐츠 기록의 대화 · 13개 원문 행</small><strong>히아킨 · 트리비</strong><span class="universe-source-excerpt" data-source-preview-role="body">회색둥이 씨, 저를 응원해 주세요!</span></span><span aria-hidden="true">→</span></a><a id="universe-source-context-4c0758a18d05130a" class="universe-source-entry" href="/starrail-quests/대화/context-4c0758a18d05130a.html" data-reading-link data-source-record="context-4c0758a18d05130a" data-source-kind-value="지역 연결 확인 중" data-search="미안 …… 힘내, 성공을 빌게 안 다치게 조심해 왜 사서 고생이야? 가자! 진짜 사방이 다 눈이랑 얼음이야 불행한 건 그쪽이지! 우리만 말썽 안 부리면 돼… 이 행성을 도와주고 싶어요 이 행성을 개척하러 왔어요 「파멸」의 에이언즈가 스텔라론을 퍼뜨렸어요 「한파」는 스텔라론이 만든 재앙이에요 「열계」는 스텔라론이 만든 현상이에요 이곳을
